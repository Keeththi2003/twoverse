name: Release

# Runs when a version tag such as v1.0.0 is pushed. Builds a signed APK and
# publishes a GitHub Release. There is no Play Store step.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Check tag, app version and changelog agree
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          APP_VERSION=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          if [ "$APP_VERSION" != "$VERSION" ]; then
            echo "::error::Tag is $VERSION but versionName in build.gradle.kts is '$APP_VERSION'"
            exit 1
          fi
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::CHANGELOG.md has no entry for $VERSION"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/android-setup
        with:
          supabase-url: ${{ secrets.SUPABASE_URL }}
          supabase-publishable-key: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          google-web-client-id: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          google-services-json: ${{ secrets.GOOGLE_SERVICES_JSON }}

      - name: Restore release keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          KEYSTORE="$RUNNER_TEMP/release.jks"
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          {
            echo "RELEASE_STORE_FILE=$KEYSTORE"
            echo "RELEASE_STORE_PASSWORD=$RELEASE_STORE_PASSWORD"
            echo "RELEASE_KEY_ALIAS=$RELEASE_KEY_ALIAS"
            echo "RELEASE_KEY_PASSWORD=$RELEASE_KEY_PASSWORD"
          } >> android/local.properties

      - name: Unit tests and lint
        working-directory: android
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      - name: Build signed release APK
        working-directory: android
        run: ./gradlew assembleRelease --stacktrace

      - name: Name the APK and verify its signature
        id: apk
        run: |
          SRC=android/app/build/outputs/apk/release/app-release.apk
          APK="twoverse-${{ steps.version.outputs.version }}.apk"
          cp "$SRC" "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose "$APK"
          sha256sum "$APK" > "$APK.sha256"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"

      - name: Keep the R8 mapping file privately
        uses: actions/upload-artifact@v4
        with:
          name: r8-mapping-${{ steps.version.outputs.version }}
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 90

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.apk.outputs.apk }}
        run: |
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Twoverse ${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            --verify-tag
