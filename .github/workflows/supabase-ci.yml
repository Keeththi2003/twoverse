name: Supabase CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: supabase-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  database:
    name: Migrations and pgTAP tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v1
        with:
          version: 2.118.0

      - name: Start local stack (applies all migrations)
        run: supabase start

      - name: Run pgTAP tests
        run: supabase test db

      - name: Stop local stack
        if: always()
        run: supabase stop --no-backup

  edge-functions:
    name: Edge Functions type check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        working-directory: supabase/functions
        run: deno check */index.ts
