<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Happy Birthday</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 0 28px 44px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="16">
<div style="{{s.style}}"></div>
</sc-for>
<div style="margin-top: 100px; width: 240px; height: 240px; position: relative; flex-shrink: 0">
<div style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid {{t.line}}"></div>
<div style="position: absolute; inset: 46px; border-radius: 50%; border: 1px dashed {{t.line}}"></div>
<div style="position: absolute; left: 100px; top: 100px; width: 40px; height: 40px; border-radius: 50%; background: {{t.starP}}; box-shadow: 0 0 60px 20px rgba(232,176,74,0.42)"></div>
<div style="position: absolute; left: 189px; top: 20px; width: 46px; height: 46px; border-radius: 50%; background: {{t.roseP}}; box-shadow: 0 10px 22px rgba(158,53,82,0.28)"></div>
<div style="position: absolute; left: 40px; top: 141px; width: 32px; height: 32px; border-radius: 50%; background: {{t.lavP}}; box-shadow: 0 8px 18px rgba(94,74,148,0.26)"></div>
</div>
<div style="margin-top: 44px; display: flex; flex-direction: column; align-items: center; text-align: center; position: relative">
<span style="font-size: 13px; font-weight: 700; letter-spacing: 2px; color: {{t.goldInk}}">FOR YOU</span>
<h1 style="margin: 10px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 46px; letter-spacing: -0.5px; line-height: 1.05">Happy Birthday</h1>
<p style="margin: 16px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 500; font-size: 21px; line-height: 1.45; white-space: pre-line">I built a little universe,
just for the two of us.</p>
<p style="margin: 14px 0 0; font-size: 15px; color: {{t.muted}}">[Your name]</p>
</div>
<div style="flex-grow: 1"></div>
<a href="Home.dc.html" style="width: 100%; height: 56px; border-radius: 28px; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none; position: relative">Enter Twoverse</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = this.props.dark ?? false;
    var t = d ? {bg:'#120E24',surface:'#1C1733',ink:'#F6ECF1',muted:'#B8AECF',line:'#2E2650',primary:'#F07C98',onPrimary:'#2A0F1C',gold:'#F2C46D',goldInk:'#F2C46D'} : {bg:'#F6ECF1',surface:'#FFFFFF',ink:'#2B1633',muted:'#6B5572',line:'#EAD9E2',primary:'#C4466A',onPrimary:'#FFFFFF',gold:'#E8B04A',goldInk:'#8A5A0B'};
    t.roseP = 'radial-gradient(circle at 32% 30%, #FFE0E8, #E0607E 55%, #9E3552)';
    t.lavP = 'radial-gradient(circle at 32% 30%, #F1E9FF, #9D86D0 55%, #5E4A94)';
    t.starP = 'radial-gradient(circle at 35% 35%, #FFF3D1, #E8B04A 60%, #C98A22)';
    var soft = d ? '#E8E2F7' : '#D7A9BF';
    var pts = [[6,12,3],[9,80,2],[14,30,2],[18,90,3],[5,55,2],[40,6,2],[44,92,3],[52,14,3],[58,84,2],[66,4,2],[70,94,2],[78,10,3],[83,88,2],[26,4,2],[30,70,2],[62,50,2]];
    var stars = pts.map(function (p, i) {
      return { style: 'position: absolute; top: ' + p[0] + '%; left: ' + p[1] + '%; width: ' + p[2] + 'px; height: ' + p[2] + 'px; border-radius: 50%; background: ' + (i % 3 === 0 ? t.gold : soft) + '; opacity: ' + (0.4 + (i % 4) * 0.15) };
    });
    return { t: t, stars: stars };
  }
}
</script>
</body>
</html>
