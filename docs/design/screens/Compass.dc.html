<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Your Star</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 56px 24px 0; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 30px; letter-spacing: -0.5px">Your Star</h1>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 1.5; color: {{t.muted}}">Turn with your phone. The star always points to her.</p>
<div style="margin-top: 24px; display: flex; justify-content: center">
<svg width="300" height="300" viewBox="0 0 300 300" role="img" aria-label="Compass pointing north-east toward your partner">
<circle cx="150" cy="150" r="146" fill="{{t.surface}}" stroke="{{t.line}}" stroke-width="1.5"></circle>
<circle cx="150" cy="150" r="126" fill="none" stroke="{{t.muted}}" stroke-opacity="0.45" stroke-width="10" stroke-dasharray="1.5 9.5"></circle>
<circle cx="150" cy="150" r="100" fill="none" stroke="{{t.line}}" stroke-width="1" stroke-dasharray="3 5"></circle>
<text x="150" y="50" text-anchor="middle" font-size="14" font-weight="700" fill="{{t.primary}}" font-family="Manrope, system-ui, sans-serif">N</text>
<text x="252" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="{{t.muted}}" font-family="Manrope, system-ui, sans-serif">E</text>
<text x="150" y="258" text-anchor="middle" font-size="13" font-weight="600" fill="{{t.muted}}" font-family="Manrope, system-ui, sans-serif">S</text>
<text x="48" y="155" text-anchor="middle" font-size="13" font-weight="600" fill="{{t.muted}}" font-family="Manrope, system-ui, sans-serif">W</text>
<g transform="rotate(42 150 150)">
<path d="M150 64 L162 150 L150 140 L138 150 Z" fill="{{t.accent}}"></path>
<path d="M150 236 L162 150 L150 160 L138 150 Z" fill="{{t.line}}"></path>
<circle cx="150" cy="62" r="12" fill="{{t.accent}}"></circle>
<circle cx="146" cy="58" r="4" fill="#FFFFFF" fill-opacity="0.55"></circle>
</g>
<circle cx="150" cy="150" r="11" fill="{{t.gold}}"></circle>
<circle cx="147" cy="147" r="4" fill="#FFF3D1"></circle>
</svg>
</div>
<div style="margin-top: 20px; display: flex; flex-direction: column; align-items: center; gap: 4px">
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 38px; line-height: 1.1">94.6 km</span>
<span style="font-size: 15px; color: {{t.muted}}">North-east · 42°</span>
</div>
<div style="margin-top: 16px; display: flex; justify-content: center; gap: 8px">
<span style="display: flex; align-items: center; gap: 6px; background: {{t.chip}}; border-radius: 16px; padding: 8px 12px; font-size: 12px; font-weight: 600">
<span style="width: 7px; height: 7px; border-radius: 50%; background: {{t.gold}}"></span>
Compass calibrated</span>
<span style="background: {{t.chip}}; border-radius: 16px; padding: 8px 12px; font-size: 12px; font-weight: 600">Her location · 12s ago</span>
</div>
<div style="margin-top: 20px; background: {{t.surface2}}; border: {{t.cardBorder}}; border-radius: 18px; padding: 14px 16px; display: flex; gap: 12px; align-items: center; font-size: 13px; line-height: 1.45; color: {{t.muted}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink: 0"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M12 11v5 M12 8h.01"></path></svg>
<span>Hold your phone flat and away from metal for the most accurate direction.</span>
</div>
<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding-top: 10px; background: {{t.surface}}; border-top: 1px solid {{t.line}}; display: flex; justify-content: space-around; align-items: flex-start">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="min-width: 72px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 12px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
<span>{{n.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = this.props.dark ?? false;
    var t = d ? {bg:'#120E24',surface:'#1C1733',surface2:'#231D3E',ink:'#F6ECF1',muted:'#B8AECF',line:'#2E2650',primary:'#F07C98',onPrimary:'#2A0F1C',accent:'#F07C98',gold:'#F2C46D',goldInk:'#F2C46D',chip:'#2A2247',danger:'#FF9494'} : {bg:'#F6ECF1',surface:'#FFFFFF',surface2:'#FBF4F7',ink:'#2B1633',muted:'#6B5572',line:'#EAD9E2',primary:'#C4466A',onPrimary:'#FFFFFF',accent:'#E0607E',gold:'#E8B04A',goldInk:'#8A5A0B',chip:'#F3E1EA',danger:'#B3261E'};
    t.cardBorder = d ? '1px solid #2E2650' : '1px solid transparent';
    var active = 1;
    var items = [
      ['Universe', 'Home.dc.html', 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z M2.5 12c0-2.2 4.3-4 9.5-4s9.5 1.8 9.5 4s-4.3 4-9.5 4s-9.5-1.8-9.5-4z'],
      ['Your Star', 'Compass.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M15.5 8.5l-2 5l-5 2l2-5z'],
      ['Ours', 'Vault.dc.html', 'M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3'],
      ['You & Her', 'Settings.dc.html', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8z M4.5 20c1.4-3.2 4.2-5 7.5-5s6.1 1.8 7.5 5']
    ];
    var nav = items.map(function (x, i) { return { label: x[0], href: x[1], d: x[2], color: i === active ? t.primary : t.muted }; });
    return { t: t, nav: nav };
  }
}
</script>
</body>
</html>
