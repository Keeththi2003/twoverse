<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Until We Meet</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 56px 24px 32px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 12px">
<a href="Home.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center; color: {{t.ink}}; flex-shrink: 0">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6l6-6"></path></svg>
</a>
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 24px">Until We Meet</h1>
</div>
<div style="margin-top: 24px; display: flex; flex-direction: column; align-items: center">
<span style="font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 104px; line-height: 1; letter-spacing: -2px">12</span>
<span style="font-size: 17px; font-weight: 600; color: {{t.muted}}; margin-top: 4px">days to go</span>
</div>
<div style="margin-top: 20px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
<sc-for list="{{units}}" as="u" hint-placeholder-count="3">
<div style="background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; border-radius: 18px; padding: 12px 0; display: flex; flex-direction: column; align-items: center; gap: 2px">
<span style="font-size: 26px; font-weight: 700">{{u.value}}</span>
<span style="font-size: 11px; font-weight: 700; letter-spacing: 1px; color: {{t.muted}}">{{u.label}}</span>
</div>
</sc-for>
</div>
<div style="margin-top: 14px; background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 16px 18px">
<div style="font-size: 15px; font-weight: 700">Getting closer</div>
<div style="font-size: 13px; color: {{t.muted}}; margin-top: 2px">Your planets meet on the day.</div>
<div style="position: relative; height: 40px; margin-top: 12px">
<div style="position: absolute; left: 20px; right: 16px; top: 19px; height: 2px; background: {{t.line}}"></div>
<div style="position: absolute; left: 20px; width: 55%; top: 19px; height: 2px; background: {{t.primary}}"></div>
<div style="position: absolute; left: 0; top: 0; width: 40px; height: 40px; border-radius: 50%; background: {{t.roseP}}"></div>
<div style="position: absolute; right: 0; top: 5px; width: 30px; height: 30px; border-radius: 50%; background: {{t.lavP}}"></div>
</div>
</div>
<div style="margin-top: 14px; background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 4px 18px">
<sc-for list="{{plan}}" as="p" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 14px; min-height: 58px; border-top: {{p.divider}}">
<div style="width: 36px; height: 36px; border-radius: 12px; background: {{t.chip}}; color: {{t.primary}}; display: flex; align-items: center; justify-content: center; flex-shrink: 0">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{p.d}}"></path></svg>
</div>
<div>
<div style="font-size: 12px; color: {{t.muted}}">{{p.label}}</div>
<div style="font-size: 15px; font-weight: 600">{{p.value}}</div>
</div>
</div>
</sc-for>
</div>
<div style="flex-grow: 1"></div>
<button type="button" style="height: 56px; border-radius: 28px; border: none; background: {{t.chip}}; color: {{t.ink}}; font-family: 'Manrope', system-ui, sans-serif; font-size: 16px; font-weight: 700">Change date</button>
<p style="margin: 10px 0 0; text-align: center; font-size: 13px; color: {{t.muted}}">You both see the same countdown.</p>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = this.props.dark ?? false;
    var t = d ? {bg:'#120E24',surface:'#1C1733',surface2:'#231D3E',ink:'#F6ECF1',muted:'#B8AECF',line:'#2E2650',primary:'#F07C98',onPrimary:'#2A0F1C',accent:'#F07C98',gold:'#F2C46D',goldInk:'#F2C46D',chip:'#2A2247',danger:'#FF9494'} : {bg:'#F6ECF1',surface:'#FFFFFF',surface2:'#FBF4F7',ink:'#2B1633',muted:'#6B5572',line:'#EAD9E2',primary:'#C4466A',onPrimary:'#FFFFFF',accent:'#E0607E',gold:'#E8B04A',goldInk:'#8A5A0B',chip:'#F3E1EA',danger:'#B3261E'};
    t.roseP = 'radial-gradient(circle at 32% 30%, #FFE0E8, #E0607E 55%, #9E3552)';
    t.lavP = 'radial-gradient(circle at 32% 30%, #F1E9FF, #9D86D0 55%, #5E4A94)';
    t.shadow = d ? 'none' : '0 8px 24px rgba(43,22,51,0.07)';
    t.cardBorder = d ? '1px solid #2E2650' : '1px solid transparent';
    var units = [{ value: '08', label: 'HOURS' }, { value: '24', label: 'MINUTES' }, { value: '10', label: 'SECONDS' }];
    var rows = [
      ['Date', 'Saturday, 10 October', 'M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4'],
      ['Place', 'Kandy', 'M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z M12 8a2 2 0 1 0 0 4a2 2 0 1 0 0-4z'],
      ['Time', 'Around 10:00 AM', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M12 7v5l3 2']
    ];
    var plan = rows.map(function (r, i) { return { label: r[0], value: r[1], d: r[2], divider: i === 0 ? 'none' : '1px solid ' + t.line }; });
    return { t: t, units: units, plan: plan };
  }
}
</script>
</body>
</html>
