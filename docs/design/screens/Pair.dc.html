<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Connect your worlds</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 56px 24px 36px; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
<a href="SignIn.dc.html" aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; display: flex; align-items: center; justify-content: center; color: {{t.ink}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6l6-6"></path></svg>
</a>
<h1 style="margin: 20px 0 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 32px; letter-spacing: -0.5px; line-height: 1.1">Connect your worlds</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: {{t.muted}}">Share your code with your partner, or enter theirs. Once you're connected, it's just the two of you.</p>
<div style="margin-top: 24px; background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 24px; display: flex; flex-direction: column; align-items: center; gap: 14px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 1.5px; color: {{t.muted}}">YOUR COUPLE CODE</span>
<span style="font-size: 36px; font-weight: 700; letter-spacing: 4px; color: {{t.ink}}">AB72-KP91</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: {{t.muted}}">
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M12 7v5l3 2"></path></svg>
Expires in 24 hours</span>
<div style="width: 100%; display: flex; gap: 10px; margin-top: 4px">
<button type="button" style="flex-grow: 1; height: 52px; border-radius: 26px; border: none; background: {{t.primary}}; color: {{t.onPrimary}}; font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; font-weight: 700">Share code</button>
<button type="button" style="height: 52px; border-radius: 26px; border: none; padding: 0 20px; background: {{t.chip}}; color: {{t.ink}}; font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 9h11v11H9z M5 15H4V4h11v1"></path></svg>
Copy</button>
</div>
</div>
<div style="margin-top: 18px; display: flex; align-items: center; justify-content: center; gap: 12px">
<div style="display: flex; align-items: center; gap: 4px">
<div style="width: 14px; height: 14px; border-radius: 50%; background: {{t.roseP}}"></div>
<div style="width: 36px; border-top: 2px dashed {{t.line}}"></div>
<div style="width: 11px; height: 11px; border-radius: 50%; background: {{t.lavP}}"></div>
</div>
<span style="font-size: 14px; color: {{t.muted}}">Waiting for your partner to join…</span>
</div>
<div style="display: flex; align-items: center; gap: 12px; margin: 24px 0 20px">
<div style="flex-grow: 1; height: 1px; background: {{t.line}}"></div>
<span style="font-size: 13px; color: {{t.muted}}">or</span>
<div style="flex-grow: 1; height: 1px; background: {{t.line}}"></div>
</div>
<div style="display: flex; flex-direction: column; gap: 8px">
<label for="partner-code" style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Your partner's code</label>
<input id="partner-code" type="text" placeholder="XXXX-XXXX" style="width: 100%; height: 54px; box-sizing: border-box; border-radius: 16px; border: 1px solid {{t.line}}; background: {{t.surface}}; color: {{t.ink}}; padding: 0 18px; font-family: 'Manrope', system-ui, sans-serif; font-size: 18px; font-weight: 600; letter-spacing: 3px">
</div>
<div style="flex-grow: 1"></div>
<a href="Home.dc.html" style="height: 56px; border-radius: 28px; border: 1.5px solid {{t.primary}}; color: {{t.primary}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; text-decoration: none; box-sizing: border-box">Connect</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = this.props.dark ?? false;
    var t = d ? {bg:'#120E24',surface:'#1C1733',surface2:'#231D3E',ink:'#F6ECF1',muted:'#B8AECF',line:'#2E2650',primary:'#F07C98',onPrimary:'#2A0F1C',accent:'#F07C98',gold:'#F2C46D',goldInk:'#F2C46D',chip:'#2A2247',danger:'#FF9494'} : {bg:'#F6ECF1',surface:'#FFFFFF',surface2:'#FBF4F7',ink:'#2B1633',muted:'#6B5572',line:'#EAD9E2',primary:'#C4466A',onPrimary:'#FFFFFF',accent:'#E0607E',gold:'#E8B04A',goldInk:'#8A5A0B',chip:'#F3E1EA',danger:'#B3261E'};
    t.roseP = 'radial-gradient(circle at 32% 30%, #FFE0E8, #E0607E 55%, #9E3552)';
    t.lavP = 'radial-gradient(circle at 32% 30%, #F1E9FF, #9D86D0 55%, #5E4A94)';
    t.shadow = d ? 'none' : '0 8px 24px rgba(43,22,51,0.07)';
    t.cardBorder = d ? '1px solid #2E2650' : '1px solid transparent';
    return { t: t };
  }
}
</script>
</body>
</html>
