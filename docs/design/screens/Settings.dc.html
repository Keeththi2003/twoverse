<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>You and Her</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 56px 20px 0; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 30px; letter-spacing: -0.5px">You &amp; Her</h1>
<div style="margin-top: 16px; background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; border-radius: 24px; padding: 18px; display: flex; align-items: center; gap: 14px">
<div style="position: relative; width: 66px; height: 44px; flex-shrink: 0">
<div style="position: absolute; left: 0; top: 0; width: 44px; height: 44px; border-radius: 50%; background: {{t.roseP}}"></div>
<div style="position: absolute; left: 30px; top: 5px; width: 34px; height: 34px; border-radius: 50%; background: {{t.lavP}}; box-shadow: 0 0 0 3px {{t.surface}}"></div>
</div>
<div>
<div style="font-size: 16px; font-weight: 700">Connected</div>
<div style="font-size: 13px; color: {{t.muted}}; margin-top: 2px">Together in Twoverse since 14 Feb 2026</div>
</div>
</div>
<div style="margin: 20px 4px 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: {{t.muted}}">PRIVACY</div>
<div style="background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; border-radius: 20px; overflow: hidden">
<sc-for list="{{privacy}}" as="r" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; min-height: 58px; padding: 8px 16px; box-sizing: border-box; border-top: {{r.divider}}">
<div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px">
<span style="font-size: 15px; font-weight: 600">{{r.title}}</span>
<sc-if value="{{r.hasSub}}" hint-placeholder-val="{{true}}">
<span style="font-size: 12px; color: {{t.muted}}">{{r.sub}}</span>
</sc-if>
</div>
<sc-if value="{{r.isSwitch}}" hint-placeholder-val="{{true}}">
<button type="button" role="switch" aria-checked="true" aria-label="{{r.title}}" style="width: 52px; height: 32px; border-radius: 16px; border: none; background: {{t.primary}}; position: relative; padding: 0; flex-shrink: 0">
<span style="position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF"></span>
</button>
</sc-if>
<sc-if value="{{r.hasValue}}" hint-placeholder-val="{{false}}">
<button type="button" aria-label="{{r.aria}}" style="min-height: 44px; display: flex; align-items: center; gap: 4px; border: none; background: transparent; color: {{t.muted}}; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; padding: 0">{{r.value}}
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"></path></svg>
</button>
</sc-if>
</div>
</sc-for>
</div>
<div style="margin: 20px 4px 8px; font-size: 12px; font-weight: 700; letter-spacing: 1.2px; color: {{t.muted}}">PREFERENCES</div>
<div style="background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; border-radius: 20px; overflow: hidden">
<sc-for list="{{prefs}}" as="r" hint-placeholder-count="2">
<div style="display: flex; align-items: center; gap: 12px; min-height: 56px; padding: 6px 16px; box-sizing: border-box; border-top: {{r.divider}}">
<span style="flex-grow: 1; font-size: 15px; font-weight: 600">{{r.title}}</span>
<button type="button" aria-label="{{r.aria}}" style="min-height: 44px; display: flex; align-items: center; gap: 4px; border: none; background: transparent; color: {{t.muted}}; font-family: 'Manrope', system-ui, sans-serif; font-size: 14px; padding: 0">{{r.value}}
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6l-6 6"></path></svg>
</button>
</div>
</sc-for>
</div>
<div style="margin-top: 16px; background: {{t.surface}}; border: {{t.cardBorder}}; box-shadow: {{t.shadow}}; border-radius: 20px; overflow: hidden; display: flex; flex-direction: column">
<button type="button" style="min-height: 54px; text-align: left; padding: 0 16px; border: none; background: transparent; color: {{t.ink}}; font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; font-weight: 600">Log out</button>
<button type="button" style="min-height: 54px; text-align: left; padding: 0 16px; border: none; border-top: 1px solid {{t.line}}; background: transparent; color: {{t.danger}}; font-family: 'Manrope', system-ui, sans-serif; font-size: 15px; font-weight: 600">Disconnect from partner</button>
</div>
<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding-top: 10px; background: {{t.surface}}; border-top: 1px solid {{t.line}}; display: flex; justify-content: space-around; align-items: flex-start">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="min-width: 72px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 12px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
<span>{{n.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = this.props.dark ?? false;
    var t = d ? {bg:'#120E24',surface:'#1C1733',surface2:'#231D3E',ink:'#F6ECF1',muted:'#B8AECF',line:'#2E2650',primary:'#F07C98',onPrimary:'#2A0F1C',accent:'#F07C98',gold:'#F2C46D',goldInk:'#F2C46D',chip:'#2A2247',danger:'#FF9494'} : {bg:'#F6ECF1',surface:'#FFFFFF',surface2:'#FBF4F7',ink:'#2B1633',muted:'#6B5572',line:'#EAD9E2',primary:'#C4466A',onPrimary:'#FFFFFF',accent:'#E0607E',gold:'#E8B04A',goldInk:'#8A5A0B',chip:'#F3E1EA',danger:'#B3261E'};
    t.roseP = 'radial-gradient(circle at 32% 30%, #FFE0E8, #E0607E 55%, #9E3552)';
    t.lavP = 'radial-gradient(circle at 32% 30%, #F1E9FF, #9D86D0 55%, #5E4A94)';
    t.shadow = d ? 'none' : '0 8px 24px rgba(43,22,51,0.07)';
    t.cardBorder = d ? '1px solid #2E2650' : '1px solid transparent';
    var line = '1px solid ' + t.line;
    var privacy = [
      { title: 'Share my location', sub: 'Only used for distance and your star', hasSub: true, isSwitch: true, hasValue: false, value: '', aria: '' },
      { title: 'Location precision', sub: '', hasSub: false, isSwitch: false, hasValue: true, value: 'Approximate', aria: 'Change location precision' },
      { title: 'Lock Ours', sub: 'Fingerprint or device PIN', hasSub: true, isSwitch: true, hasValue: false, value: '', aria: '' }
    ].map(function (r, i) { r.divider = i === 0 ? 'none' : line; return r; });
    var prefs = [
      { title: 'Distance unit', value: 'Kilometres', aria: 'Change distance unit' },
      { title: 'Appearance', value: 'System', aria: 'Change appearance' }
    ].map(function (r, i) { r.divider = i === 0 ? 'none' : line; return r; });
    var active = 3;
    var items = [
      ['Universe', 'Home.dc.html', 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z M2.5 12c0-2.2 4.3-4 9.5-4s9.5 1.8 9.5 4s-4.3 4-9.5 4s-9.5-1.8-9.5-4z'],
      ['Your Star', 'Compass.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M15.5 8.5l-2 5l-5 2l2-5z'],
      ['Ours', 'Vault.dc.html', 'M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3'],
      ['You & Her', 'Settings.dc.html', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8z M4.5 20c1.4-3.2 4.2-5 7.5-5s6.1 1.8 7.5 5']
    ];
    var nav = items.map(function (x, i) { return { label: x[0], href: x[1], d: x[2], color: i === active ? t.primary : t.muted }; });
    return { t: t, privacy: privacy, prefs: prefs, nav: nav };
  }
}
</script>
</body>
</html>
