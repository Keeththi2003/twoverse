<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Twoverse splash, light</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600&amp;display=swap">
<style>
body{margin:0;font-family:'Manrope',system-ui,sans-serif;background:#F6ECF1}
@keyframes tv-spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes tv-twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes tv-pulse{0%,100%{opacity:.3;transform:scale(.8)}50%{opacity:1;transform:scale(1)}}
.tv-orbit{animation:tv-spin 28s linear infinite}
.tv-counter{animation:tv-spin 28s linear infinite reverse}
.tv-twinkle{animation:tv-twinkle 3.2s ease-in-out infinite}
.tv-dot{animation:tv-pulse 1.4s ease-in-out infinite}
.tv-dot2{animation-delay:.2s}
.tv-dot3{animation-delay:.4s}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #F6ECF1; color: #2B1633; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; box-sizing: border-box">
<sc-for list="{{stars}}" as="s" hint-placeholder-count="14">
<div class="tv-twinkle" style="{{s.style}}"></div>
</sc-for>
<div style="flex-grow: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 40px; position: relative">
<div style="width: 232px; height: 232px; position: relative">
<div style="position: absolute; inset: 0; border-radius: 50%; border: 1.5px solid #E4CFDC"></div>
<div style="position: absolute; inset: 44px; border-radius: 50%; border: 1px dashed #E9D8E3"></div>
<div style="position: absolute; left: 50%; top: 50%; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #FFF3D1, #E8B04A 60%, #C98A22); box-shadow: 0 0 24px 6px rgba(232,176,74,0.45)"></div>
<div class="{{orbitClass}}" style="position: absolute; inset: 0">
<div class="{{counterClass}}" style="position: absolute; left: 50%; top: 0; width: 48px; height: 48px; margin: -24px 0 0 -24px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #FFE0E8, #E0607E 55%, #9E3552); box-shadow: 0 10px 22px rgba(158,53,82,0.30)"></div>
<div class="{{counterClass}}" style="position: absolute; left: 50%; bottom: 0; width: 36px; height: 36px; margin: 0 0 -18px -18px; border-radius: 50%; background: radial-gradient(circle at 32% 30%, #F1E9FF, #9D86D0 55%, #5E4A94); box-shadow: 0 10px 20px rgba(94,74,148,0.28)"></div>
</div>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 46px; letter-spacing: -0.5px; line-height: 1; color: #2B1633">Twoverse</h1>
<p style="margin: 0; font-size: 15px; font-weight: 500; color: #6B5572; letter-spacing: 0.2px">A private universe for two.</p>
</div>
</div>
<div style="padding-bottom: 56px; display: flex; flex-direction: column; align-items: center; gap: 14px; position: relative">
<div style="display: flex; gap: 8px" aria-label="Loading">
<div class="tv-dot" style="width: 7px; height: 7px; border-radius: 50%; background: #E0607E"></div>
<div class="tv-dot tv-dot2" style="width: 7px; height: 7px; border-radius: 50%; background: #E0607E"></div>
<div class="tv-dot tv-dot3" style="width: 7px; height: 7px; border-radius: 50%; background: #E0607E"></div>
</div>
<p style="margin: 0; font-size: 13px; color: #6B5572">Connecting your worlds…</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"animate":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var animate = this.props.animate ?? true;
    var pts = [[8,12,3],[18,78,2],[26,40,4],[14,55,2],[33,88,3],[62,9,2],[70,85,4],[78,22,3],[85,64,2],[90,38,3],[48,94,2],[55,5,3],[40,16,2],[74,50,2]];
    var stars = pts.map(function (p, i) {
      return { style: 'position: absolute; top: ' + p[0] + '%; left: ' + p[1] + '%; width: ' + p[2] + 'px; height: ' + p[2] + 'px; border-radius: 50%; background: ' + (i % 3 === 0 ? '#E8B04A' : '#D7A9BF') + '; animation-delay: ' + (i * 0.37).toFixed(2) + 's' };
    });
    return {
      stars: stars,
      orbitClass: animate ? 'tv-orbit' : '',
      counterClass: animate ? 'tv-counter' : ''
    };
  }
}
</script>
</body>
</html>
