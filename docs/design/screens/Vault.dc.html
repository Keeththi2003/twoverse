<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ours</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&amp;family=Manrope:wght@400;500;600;700&amp;display=swap">
<style>body{margin:0}</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; box-sizing: border-box; padding: 56px 20px 0; background: {{t.bg}}; color: {{t.ink}}; font-family: 'Manrope', system-ui, sans-serif; display: flex; flex-direction: column">
<div style="display: flex; align-items: center; gap: 10px">
<h1 style="margin: 0; font-family: 'Fraunces', Georgia, serif; font-weight: 600; font-size: 30px; letter-spacing: -0.5px">Ours</h1>
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="{{t.primary}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3"></path></svg>
</div>
<p style="margin: 6px 0 0; font-size: 14px; color: {{t.muted}}">17 memories · only you two can open these</p>
<div style="margin-top: 18px; display: flex; gap: 8px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.pressed}}" style="height: 36px; border-radius: 18px; border: none; padding: 0 14px; background: {{c.bg}}; color: {{c.color}}; font-family: 'Manrope', system-ui, sans-serif; font-size: 13px; font-weight: 600">{{c.label}}</button>
</sc-for>
</div>
<div style="margin-top: 18px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
<sc-for list="{{tiles}}" as="m" hint-placeholder-count="12">
<a href="Memory.dc.html" aria-label="{{m.label}}" style="position: relative; height: 112px; border-radius: 16px; background: {{m.bg}}; border: {{t.cardBorder}}; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; text-decoration: none">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="opacity: 0.7"><path d="M4 5h16v14H4z M4 16l5-5l4 4l3-3l4 4 M15 8a1.5 1.5 0 1 0 0 3a1.5 1.5 0 1 0 0-3z"></path></svg>
<sc-if value="{{m.hasBadge}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 8px; left: 8px; padding: 3px 8px; border-radius: 10px; background: {{t.surface}}; color: {{t.ink}}; font-size: 11px; font-weight: 700">{{m.badge}}</span>
</sc-if>
<sc-if value="{{m.isNew}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 10px; right: 10px; width: 9px; height: 9px; border-radius: 50%; background: {{t.accent}}"></span>
</sc-if>
</a>
</sc-for>
</div>
<a href="AddMemory.dc.html" aria-label="Add a memory" style="position: absolute; right: 20px; bottom: 104px; width: 60px; height: 60px; border-radius: 50%; background: {{t.primary}}; color: {{t.onPrimary}}; display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 24px rgba(196,70,106,0.35)">
<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14 M5 12h14"></path></svg>
</a>
<nav style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; padding-top: 10px; background: {{t.surface}}; border-top: 1px solid {{t.line}}; display: flex; justify-content: space-around; align-items: flex-start">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="4">
<a href="{{n.href}}" style="min-width: 72px; min-height: 48px; display: flex; flex-direction: column; align-items: center; gap: 4px; text-decoration: none; color: {{n.color}}; font-size: 12px; font-weight: 600">
<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
<span>{{n.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    var d = this.props.dark ?? false;
    var t = d ? {bg:'#120E24',surface:'#1C1733',surface2:'#231D3E',ink:'#F6ECF1',muted:'#B8AECF',line:'#2E2650',primary:'#F07C98',onPrimary:'#2A0F1C',accent:'#F07C98',gold:'#F2C46D',goldInk:'#F2C46D',chip:'#2A2247',danger:'#FF9494'} : {bg:'#F6ECF1',surface:'#FFFFFF',surface2:'#FBF4F7',ink:'#2B1633',muted:'#6B5572',line:'#EAD9E2',primary:'#C4466A',onPrimary:'#FFFFFF',accent:'#E0607E',gold:'#E8B04A',goldInk:'#8A5A0B',chip:'#F3E1EA',danger:'#B3261E'};
    t.cardBorder = d ? '1px solid #2E2650' : '1px solid transparent';
    var tints = d ? ['#2A2247', '#2B2350', '#33263A', '#1C1733'] : ['#F3E1EA', '#ECE5F7', '#FBEFD9', '#FFFFFF'];
    var chips = ['All', 'From you', 'From her', 'Expiring'].map(function (l, i) {
      return { label: l, pressed: i === 0 ? 'true' : 'false', bg: i === 0 ? t.primary : t.chip, color: i === 0 ? t.onPrimary : t.ink };
    });
    var badges = { 1: '24h', 4: '7d', 8: '2d' };
    var tiles = [];
    for (var i = 0; i < 12; i++) {
      tiles.push({ label: 'Memory ' + (i + 1), bg: tints[i % 4], hasBadge: !!badges[i], badge: badges[i] || '', isNew: i === 0 || i === 2 });
    }
    var active = 2;
    var items = [
      ['Universe', 'Home.dc.html', 'M12 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z M2.5 12c0-2.2 4.3-4 9.5-4s9.5 1.8 9.5 4s-4.3 4-9.5 4s-9.5-1.8-9.5-4z'],
      ['Your Star', 'Compass.dc.html', 'M12 3a9 9 0 1 0 0 18a9 9 0 1 0 0-18z M15.5 8.5l-2 5l-5 2l2-5z'],
      ['Ours', 'Vault.dc.html', 'M6 11h12v9H6z M8.5 11V8a3.5 3.5 0 0 1 7 0v3'],
      ['You & Her', 'Settings.dc.html', 'M12 12a4 4 0 1 0 0-8a4 4 0 1 0 0 8z M4.5 20c1.4-3.2 4.2-5 7.5-5s6.1 1.8 7.5 5']
    ];
    var nav = items.map(function (x, i) { return { label: x[0], href: x[1], d: x[2], color: i === active ? t.primary : t.muted }; });
    return { t: t, chips: chips, tiles: tiles, nav: nav };
  }
}
</script>
</body>
</html>
